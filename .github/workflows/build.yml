name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with in-box WPF compiler
        shell: pwsh
        run: ./build.ps1

      - name: Package portable release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item '番茄时钟.exe','番茄时钟.exe.config','README.md','README.en.md','LICENSE' dist
          Compress-Archive -Path 'dist\*' -DestinationPath 'tomato-clock-windows.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomato-clock-windows
          path: tomato-clock-windows.zip
          if-no-files-found: error
