name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with in-box WPF compiler
        shell: pwsh
        run: ./build.ps1

      - name: Package portable release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item '番茄时钟.exe','番茄时钟.exe.config','README.md','README.en.md','LICENSE' dist
          Compress-Archive -Path 'dist\*' -DestinationPath 'tomato-clock-windows.zip' -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "tomato-clock-windows.zip" `
            --title "番茄时钟 $env:GITHUB_REF_NAME" `
            --generate-notes
